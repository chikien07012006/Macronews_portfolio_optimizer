[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "macronews"
version = "0.1.0"
description = "News- and momentum-driven portfolio backtesting simulator for U.S. sector ETFs"
readme = "README.md"
requires-python = ">=3.11"
# Dependencies are pinned in requirements.txt / requirements-nlp.txt.

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
